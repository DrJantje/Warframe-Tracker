name: Install account sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install_account_sync.py'
      - '.github/workflows/install-account-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Install account-sync merge logic
        run: python scripts/install_account_sync.py

      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No app changes detected."
            exit 0
          fi
          git commit -m "Load sanitized live account sync"
          git push
